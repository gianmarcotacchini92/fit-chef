name: Deploy FIT Diario AI to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate required Cloudflare and Firebase configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIT_FIREBASE_PROJECT_ID: ${{ secrets.FIT_FIREBASE_PROJECT_ID }}
          FIT_ALLOWED_FIREBASE_UID: ${{ secrets.FIT_ALLOWED_FIREBASE_UID }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FIT_FIREBASE_PROJECT_ID FIT_ALLOWED_FIREBASE_UID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name"
              exit 1
            fi
          done
      - name: Install Wrangler CLI
        run: npm install --global wrangler@4
      - name: Verify Cloudflare token and account permissions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")" || {
            echo "::error::Cloudflare API token verification failed. Check that CLOUDFLARE_API_TOKEN is valid."
            exit 1
          }
          echo "$response" | node -e '
            let s = ""; process.stdin.on("data", c => s += c);
            process.stdin.on("end", () => { const r = JSON.parse(s); if (!r.success || r.result?.status !== "active") {
              console.error("::error::Cloudflare API token is not active."); process.exit(1);
            } console.log("Cloudflare API token is active."); });
          '
          account_response="$(curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}")" || {
            echo "::error::The token cannot read the configured Cloudflare account. Check CLOUDFLARE_ACCOUNT_ID and the token account scope."
            exit 1
          }
          echo "$account_response" | node -e '
            let s = ""; process.stdin.on("data", c => s += c);
            process.stdin.on("end", () => { const r = JSON.parse(s); if (!r.success) {
              console.error("::error::Cloudflare account access denied."); process.exit(1);
            } console.log("Cloudflare account access confirmed."); });
          '
          echo "Preflight passed. Worker deployment may still require Workers Scripts:Edit and Workers Secrets:Edit permissions."
      - name: Deploy Worker (locked down before secrets are installed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config cloudflare/wrangler.toml
      - name: Set mandatory Worker secrets and make AI available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIT_FIREBASE_PROJECT_ID: ${{ secrets.FIT_FIREBASE_PROJECT_ID }}
          FIT_ALLOWED_FIREBASE_UID: ${{ secrets.FIT_ALLOWED_FIREBASE_UID }}
        run: |
          printf '%s' "$FIT_FIREBASE_PROJECT_ID" | wrangler secret put FIREBASE_PROJECT_ID --config cloudflare/wrangler.toml
          printf '%s' "$FIT_ALLOWED_FIREBASE_UID" | wrangler secret put ALLOWED_FIREBASE_UID --config cloudflare/wrangler.toml
          printf '%s' 'https://gianmarcotacchini92.github.io' | wrangler secret put ALLOWED_ORIGIN --config cloudflare/wrangler.toml
      - name: Final configuration instructions
        run: |
          echo "Worker deployed with Firebase identity and fixed origin restrictions."
          echo "Copy the Worker HTTPS URL from Cloudflare Workers & Pages."
          echo "Set repository variable NEXT_PUBLIC_MEAL_AI_URL to that URL."
          echo "Re-run Publish FIT Chef in GitHub Actions to publish the AI-enabled static app."
          echo "No credentials should be put in NEXT_PUBLIC_ variables."
