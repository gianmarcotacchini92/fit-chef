name: Deploy FIT Diario AI to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate required Cloudflare and Firebase configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIT_FIREBASE_PROJECT_ID: ${{ secrets.FIT_FIREBASE_PROJECT_ID }}
          FIT_ALLOWED_FIREBASE_UID: ${{ secrets.FIT_ALLOWED_FIREBASE_UID }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FIT_FIREBASE_PROJECT_ID FIT_ALLOWED_FIREBASE_UID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name"
              exit 1
            fi
          done
      - name: Install Wrangler CLI
        run: npm install --global wrangler@4
      - name: Deploy Worker (locked down before secrets are installed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config cloudflare/wrangler.toml
      - name: Set mandatory Worker secrets and make AI available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIT_FIREBASE_PROJECT_ID: ${{ secrets.FIT_FIREBASE_PROJECT_ID }}
          FIT_ALLOWED_FIREBASE_UID: ${{ secrets.FIT_ALLOWED_FIREBASE_UID }}
        run: |
          printf '%s' "$FIT_FIREBASE_PROJECT_ID" | wrangler secret put FIREBASE_PROJECT_ID --config cloudflare/wrangler.toml
          printf '%s' "$FIT_ALLOWED_FIREBASE_UID" | wrangler secret put ALLOWED_FIREBASE_UID --config cloudflare/wrangler.toml
          printf '%s' 'https://gianmarcotacchini92.github.io' | wrangler secret put ALLOWED_ORIGIN --config cloudflare/wrangler.toml
      - name: Final configuration instructions
        run: |
          echo "Worker deployed with Firebase identity and fixed origin restrictions."
          echo "Copy the Worker HTTPS URL from Cloudflare Workers & Pages."
          echo "Set repository variable NEXT_PUBLIC_MEAL_AI_URL to that URL."
          echo "Re-run Publish FIT Chef in GitHub Actions to publish the AI-enabled static app."
          echo "No credentials should be put in NEXT_PUBLIC_ variables."
